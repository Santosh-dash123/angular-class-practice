<div class="card">
  <div class="card-header">
    <h4 class="mb-1">Post List</h4>
  </div>
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-bordered table-hover mb-0">
        <thead class="">
          <tr>
            <th>ID</th>
            <th>User Id</th>
            <th>Title</th>
            <th>Body</th>
          </tr>
        </thead>
        <tbody>
          @for (item of posts; track item.id) {
            <tr>
              <td>{{ item.id }}</td>
              <td>{{ item.userId }}</td>
              <td>{{ item.title }}</td>
              <td>{{ item.body }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
