<div class="container mt-4">
  <h2 class="mb-4">Post Management</h2>
  <div class="card mb-4">
    <div class="card-header">
      <h4 class="mb-1">Generate Post</h4>
    </div>
    <div class="card-body">
      <form (ngSubmit)="addPost()">
        <div class="mb-3">
          <label class="form-label"> UserId </label>
          <input
            type="text"
            class="form-control"
            name="userId"
            [(ngModel)]="post.userId"
          />
        </div>
        <div class="mb-3">
          <label class="form-label"> Title </label>
          <input
            type="text"
            class="form-control"
            name="title"
            [(ngModel)]="post.title"
          />
        </div>
        <div class="mb-3">
          <label class="form-label"> Body </label>
          <input
            type="text"
            class="form-control"
            name="body"
            [(ngModel)]="post.body"
          />
        </div>
        <button type="submit" class="btn btn-primary">Create Post</button>
      </form>
    </div>
  </div>
  <div class="card">
    <div class="card-header">
      <h4 class="mb-1">Post List</h4>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-bordered table-hover mb-0">
          <thead class="">
            <tr>
              <th>ID</th>
              <th>User Id</th>
              <th>Title</th>
              <th>Body</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            @for (item of posts; track item.id) {
              <tr>
                <td>{{ item.id }}</td>
                <td>{{ item.userId }}</td>
                <td>{{ item.title }}</td>
                <td>{{ item.body }}</td>
                <td>
                  <button
                    class="btn btn-outline-info"
                    (click)="getPostById(item.id!)"
                  >
                    View Post
                  </button>
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
