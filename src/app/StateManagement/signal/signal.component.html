<h1 class="text-center">{{ count() }}</h1>

<!-- <button (click)="setCount()">Set Count</button> -->

<div class="d-flex justify-content-center align-items-center gap-3">
  <button class="btn btn-outline-primary" (click)="increaseCount()">
    Increase
  </button>
  <button class="btn btn-outline-secondary" (click)="resetCount()">
    Reset
  </button>
  <button class="btn btn-outline-danger" (click)="decreaseCount()">
    Decrease
  </button>
</div>
